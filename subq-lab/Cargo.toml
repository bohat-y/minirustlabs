[package]
name = "subq-lab"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-openai = { version = "0.42", optional = true, features = ["chat-completion", "responses", "file", "model"] }


[features]
openai = ["dep:async-openai"]


[[example]]
name = "chat"
required-features = ["openai"]
