[package]
name = "subq-lab"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Unofficial Rust client for the SubQ Decisions API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bohat-y/minirustlabs"
readme = "README.md"
keywords = ["subq", "llm", "classification", "decisions", "api"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["examples/*.jpg", "examples/*.png", "examples/*.webp"]

[dependencies]
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-openai = { version = "0.42", optional = true, features = ["chat-completion", "responses", "file", "model"] }

[features]
openai = ["dep:async-openai"]

[[example]]
name = "chat"
required-features = ["openai"]

[package.metadata.docs.rs]
all-features = true
